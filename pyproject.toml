[project]
name = "webscout"
version = "0.1.0"
description = "Mini deep-research agent"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "trafilatura>=2.0",
    "httpx>=0.28",
    "pydantic-settings[yaml]>=2.6",
    "langsmith>=0.3",
    "python-dotenv>=1.0",
]

[project.scripts]
webscout = "app.main:main"
webscout-web = "web.server:main"
webscout-acp = "app.acp_server:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
acp = ["agent-client-protocol>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "web"]

[tool.pytest.ini_options]
markers = [
    "integration: requires OPENROUTER_API_KEY and network",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
